syntax = "proto3";

package delivery;

service DeliveryService {
    rpc AssignDelivery (DeliveryRequest) returns (DeliveryResponse);
    rpc GetDelivery (DeliveryId) returns (DeliveryResponse);
    rpc GetDeliveries (Empty) returns (DeliveryList);
    rpc UpdateDeliveryStatus (UpdateStatusRequest) returns (DeliveryResponse);
}

message DeliveryRequest {
    int32 order_id = 1;
    string address = 2;
}

message DeliveryId {
    string id = 1;
}

message DeliveryResponse {
    string id = 1;
    int32 order_id = 2;
    string address = 3;
    string status = 4;
}

message DeliveryList {
    repeated DeliveryResponse deliveries = 1;
}

message UpdateStatusRequest {
    string id = 1;
    string status = 2;
}

message Empty {}